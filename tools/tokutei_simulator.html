function findOption(options, key) {
  return options.find(o => o.key === key);
}

function judgeTokutei1(input) {
  const t = REQUIREMENTS.tokutei1;
  const breakdown = [], deficiencies = [], recommendations = [];
  let total = 0, instantFail = false, instantFailReason = "";

  const indTable = t.industry;
  const indOpt = findOption(indTable.eligible_industries, input.industryKey);
  if (indOpt) {
    breakdown.push({ axis: indTable.axis_name, label: indOpt.label, score: indOpt.score, max: indTable.max_score, note: "" });
    total += indOpt.score;
  } else {
    breakdown.push({ axis: indTable.axis_name, label: indTable.ineligible.label, score: 0, max: indTable.max_score, note: indTable.ineligible.note });
    instantFail = true;
    instantFailReason = "対象分野外のため特定技能1号での申請は不可です";
    deficiencies.push("対象分野（16分野）に該当しません");
    recommendations.push("特定技能1号は16分野に限定されています。技人国・技能・特定活動等の別在留資格をご検討ください。");
    ["skill_requirement","japanese_ability","residence_status","employer_status"].forEach(key => {
      const ax = t[key];
      breakdown.push({ axis: ax.axis_name, label: "（業種不適格のため評価対象外）", score: 0, max: ax.max_score, note: "" });
    });
    return { visaType: t.name, totalScore: 0, maxScore: t.total_max, scoreRate: 0, rank: "C", breakdown, deficiencies, recommendations, instantFail, instantFailReason };
  }

  const skillTable = t.skill_requirement;
  const skillOpt = findOption(skillTable.options, input.skillKey);
  if (skillOpt) {
    breakdown.push({ axis: skillTable.axis_name, label: skillOpt.label, score: skillOpt.score, max: skillTable.max_score, note: skillOpt.note || "" });
    total += skillOpt.score;
    if (skillOpt.score === 0) {
      deficiencies.push("技能評価試験に合格していません");
      recommendations.push("各分野の技能評価試験の受験・合格が必要です。技能実習2号良好修了（同一分野）の場合は試験免除となります。");
    } else if (skillOpt.score === 10) {
      recommendations.push("技能実習2号は修了済みですが分野が異なるため、当該分野の技能評価試験を受験する必要があります。");
    }
  }

  const jpTable = t.japanese_ability;
  const jpOpt = findOption(jpTable.options, input.japaneseKey);
  if (jpOpt) {
    breakdown.push({ axis: jpTable.axis_name, label: jpOpt.label, score: jpOpt.score, max: jpTable.max_score, note: jpOpt.note || "" });
    total += jpOpt.score;
    if (jpOpt.score === 0) {
      deficiencies.push("日本語能力要件を満たしていません");
      recommendations.push("JLPT N4以上またはJFT-Basicの合格が必要です。技能実習2号良好修了者は日本語試験も免除されます。");
    }
  }

  if (input.industryKey === "kaigo" && input.kaigoJapaneseBonus) {
    const bonus = jpTable.kaigo_bonus;
    breakdown.push({ axis: "介護日本語評価試験（加算）", label: bonus.label, score: bonus.score, max: bonus.score, note: bonus.note, isBonus: true });
    total += bonus.score;
  } else if (input.industryKey === "kaigo" && !input.kaigoJapaneseBonus) {
    recommendations.push("介護分野では、JLPT・JFT-Basicに加えて「介護日本語評価試験」の合格が事実上必須となります（介護現場での日常会話・記録対応のため）。");
  }

  const resTable = t.residence_status;
  const resOpt = findOption(resTable.options, input.residenceKey);
  if (resOpt) {
    breakdown.push({ axis: resTable.axis_name, label: resOpt.label, score: resOpt.score, max: resTable.max_score, note: resOpt.note || "" });
    total += resOpt.score;
    if (resOpt.score === 0) {
      deficiencies.push("在留状況・前歴に重大な問題があります");
      recommendations.push("不法残留歴・退去強制歴・刑事前科がある場合は許可が困難です。詳細確認のうえ弁明書等の検討が必要です。");
    } else if (resOpt.score === 10) {
      recommendations.push("前歴に軽微な問題があります。経緯を丁寧に説明した申立書の作成を推奨します。");
    }
  }

  const empTable = t.employer_status;
  const empOpt = findOption(empTable.options, input.employerKey);
  if (empOpt) {
    breakdown.push({ axis: empTable.axis_name, label: empOpt.label, score: empOpt.score, max: empTable.max_score, note: empOpt.note || "" });
    total += empOpt.score;
    if (empOpt.score === 0) {
      deficiencies.push("特定技能所属機関（受入機関）の登録が完了していません");
      recommendations.push("受入機関の特定技能所属機関登録と、該当分野の協議会加入が申請の前提条件です。");
    } else if (empOpt.score === 5) {
      recommendations.push("所属機関登録が申請中です。登録証明書の取得後、追完資料として提出してください。");
    }
  }

  let rank;
  if (total >= t.pass_lines.green) rank = "A";
  else if (total >= t.pass_lines.yellow) rank = "B";
  else rank = "C";

  return { visaType: t.name, totalScore: total, maxScore: t.total_max, scoreRate: total / t.total_max, rank, breakdown, deficiencies, recommendations, instantFail: false, instantFailReason: "" };
}

/* スコアバー（改良版） */
const ScoreBar = ({ score, max, animated = false }) => {
  const pct = Math.min(100, (score / max) * 100);
  const getColor = () => {
    if (pct === 0) return '#e7e5e4';
    if (pct >= 100) return '#047857';
    if (pct >= 60) return '#d97706';
    return '#991b1b';
  };
  return (
    <div className="w-full h-2 bg-stone-100 rounded-full overflow-hidden">
      <div className={animated ? "bar-animate" : ""}
        style={{
          height: '100%', width: `${pct}%`,
          background: `linear-gradient(90deg, ${getColor()}cc, ${getColor()})`,
          borderRadius: '9999px',
          transition: 'width 0.6s cubic-bezier(0.4,0,0.2,1)',
          boxShadow: pct > 0 ? `0 0 6px ${getColor()}44` : 'none',
        }} />
    </div>
  );
};

const RankRing = ({ rank, score, max }) => {

  const RankIcon = style.icon;
  const pct = max > 0 ? Math.min(100, (score / max) * 100) : 0;
  const circumference = 2 * Math.PI * 38;
  const dashOffset = circumference * (1 - pct / 100);
  return (
    <div className="relative flex-shrink-0" style={{ width: 96, height: 96 }}>
      <svg width="96" height="96" viewBox="0 0 96 96" style={{ transform: 'rotate(-90deg)' }}>

                <div className="grid grid-cols-2 gap-2">
                  {[
                    { n: "16", label: "対応分野数", sub: "2024年3月時点" },
                    { n: "5", label: "診断軸", sub: "業種・試験・語学ほか" },
                    { n: "110", label: "満点スコア", sub: "加算ボーナス込み" },
                    { n: "即時", label: "診断速度", sub: "入力完了と同時" },
                  ].map(item => (
                    <div key={item.n} className="text-center px-2 py-2 rounded" style={{ background: 'rgba(255,255,255,0.06)' }}>
                      <div className="font-mincho text-xl font-bold text-white">{item.n}</div>
                      <div className="text-[10px] text-stone-300 font-bold leading-tight">{item.label}</div>
                      <div className="text-[9px] text-stone-500 leading-tight mt-0.5">{item.sub}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      {/* ────────────────────────────────────────
          メインコンテンツ
      ──────────────────────────────────────── */}
      <main className="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
        <div className="grid lg:grid-cols-5 gap-5 sm:gap-6 items-start">

          {/* ════════════════════════════════════
              左カラム：入力フォーム
          ════════════════════════════════════ */}
          <div className="lg:col-span-3 space-y-4">

            {/* ── 1. 対象分野 ── */}
            <div className="section-card overflow-hidden">
              <SectionHeader icon={<Building />} title="対象分野" badge="必須・即時不適格判定" />
              <div className="p-4 sm:p-5">
                {input.industryKey === "kaigo" && (
                  <div className="mb-3 flex items-start gap-2.5 p-3 rounded" style={{ background: 'linear-gradient(135deg, #fff7f7, #fff1f1)', border: '1px solid #fecaca' }}>
                    <HeartHandshake size={16} className="text-red-700 mt-0.5 flex-shrink-0" />
                    <div>
                      <div className="text-xs font-bold text-red-800 mb-0.5">介護分野が選択されています</div>
                      <div className="text-[11px] text-red-700/80 leading-relaxed">介護施設での特定技能外国人受入れに最適化された診断を行います。介護日本語評価試験ボーナスが日本語能力欄に表示されます。</div>
                    </div>
                  </div>
                )}
                <FieldLabel required>外国人材を受け入れる業種</FieldLabel>
                <SelectInput value={input.industryKey}
                  onChange={e => update('industryKey', e.target.value)}
                  options={industryOptions} />
                <div className="mt-2.5 flex flex-wrap gap-x-4 gap-y-1">
                  <p className="text-[11px] text-stone-500 leading-relaxed">
                    特定技能1号は16分野に限定。上記以外の業種は対象外です。
                  </p>
                  <p className="text-[11px] text-amber-700 font-medium leading-relaxed">
                    ※ 2027年に倉庫管理・リネンサプライ・資源循環の3分野追加予定（合計19分野へ）。
                  </p>
                </div>
              </div>
            </div>

            {/* ── 2. 技能評価試験 ── */}
            <div className="section-card overflow-hidden">
              <SectionHeader icon={<Award />} title="技能評価試験" />
              <div className="p-4 sm:p-5">
                <RadioGroup name="skill" value={input.skillKey}
                  onChange={e => update('skillKey', e.target.value)}
                  options={t.skill_requirement.options.map(o => ({ value: o.key, label: o.label, note: o.note }))} />
              </div>
            </div>

            {/* ── 3. 日本語能力 ── */}
            <div className="section-card overflow-hidden">
              <SectionHeader icon={<Languages />} title="日本語能力" />
              <div className="p-4 sm:p-5 space-y-3">
                <RadioGroup name="japanese" value={input.japaneseKey}
                  onChange={e => update('japaneseKey', e.target.value)}
                  options={t.japanese_ability.options.map(o => ({ value: o.key, label: o.label, note: o.note }))} />
                {input.industryKey === "kaigo" && (
                  <div className="pt-3 border-t border-stone-100">
                    <div className="flex items-center gap-2 mb-2">
                      <div className="h-px flex-1 bg-amber-200" />
                      <span className="text-[10px] font-bold text-amber-700 tracking-wider">介護分野限定ボーナス</span>
                      <div className="h-px flex-1 bg-amber-200" />
                    </div>
                    <CheckboxField
                      checked={input.kaigoJapaneseBonus}
                      onChange={e => update('kaigoJapaneseBonus', e.target.checked)}
                      label={t.japanese_ability.kaigo_bonus.label}
                      note={t.japanese_ability.kaigo_bonus.note} />
                  </div>
                )}
              </div>
            </div>

            {/* ── 4. 在留状況 ── */}
            <div className="section-card overflow-hidden">
              <SectionHeader icon={<ShieldCheck />} title="在留状況・前歴" />
              <div className="p-4 sm:p-5">
                <RadioGroup name="residence" value={input.residenceKey}
                  onChange={e => update('residenceKey', e.target.value)}
                  options={t.residence_status.options.map(o => ({ value: o.key, label: o.label, note: o.note }))} />
              </div>
            </div>

            {/* ── 5. 所属機関 ── */}

              <SectionHeader icon={<Briefcase />} title="特定技能所属機関(受入機関)" />
              <div className="p-4 sm:p-5">

                  onChange={e => update('employerKey', e.target.value)}

              右カラム：診断結果
          ════════════════════════════════════ */}

            {/* ── 判定メインカード ── */}

              style={{ border: `2px solid ${rankStyle.ringColor}22` }}>
              {/* ヘッダーバー */}
              <div className="px-4 sm:px-5 py-2.5 flex items-center gap-2"
                style={{ background: rankStyle.ringColor, borderBottom: `1px solid ${rankStyle.ringColor}` }}>
                <ScrollText size={13} className="text-white opacity-80" />
                <span className="text-xs font-bold tracking-widest text-white/90">診断結果 ／ INSTANT VERDICT</span>
              </div>

              {/* スコアメイン */}
              <div className="p-4 sm:p-5">
                <div className="flex items-center gap-4 mb-4">
                  <RankRing rank={result.rank} score={result.totalScore} max={result.maxScore} />
                  <div className="flex-1 min-w-0">
                    <div className="font-mincho text-xs text-stone-500 tracking-wider mb-0.5">{result.visaType}</div>
                    <div className="font-mincho text-xl sm:text-2xl font-bold leading-tight mb-1"
                      style={{ color: rankStyle.ringColor }}>
                      {rankStyle.label}
                    </div>
                    {!result.instantFail ? (
                      <>
                        <div className="text-sm font-bold text-stone-800">
                          {result.totalScore} <span className="text-stone-400 font-normal text-xs">/ {result.maxScore}点</span>
                        </div>
                        <div className="mt-1.5">
                          <div className="flex justify-between text-[10px] text-stone-500 mb-1">
                            <span>充足率</span>
                            <span className="font-bold" style={{ color: rankStyle.ringColor }}>{(result.scoreRate * 100).toFixed(1)}%</span>
                          </div>
                          <div className="w-full h-2 rounded-full overflow-hidden" style={{ background: '#e7e5e4' }}>
                            <div style={{
                              height: '100%', width: `${(result.scoreRate * 100).toFixed(1)}%`,
                              background: `linear-gradient(90deg, ${rankStyle.ringColor}99, ${rankStyle.ringColor})`,
                              borderRadius: 9999,
                              transition: 'width 0.8s cubic-bezier(0.4,0,0.2,1)',
                              boxShadow: `0 0 8px ${rankStyle.ringColor}44`,
                            }} />
                          </div>
                        </div>
                      </>
                    ) : (
                      <div className="text-xs font-bold text-red-800 mt-1">即時不適格</div>
                    )}
                  </div>
                </div>

                {/* 合否ライン表示 */}
                {!result.instantFail && (
                  <div className="flex items-center gap-2 mb-3 text-[10px] text-stone-500">
                    <div className="flex items-center gap-1">
                      <div className="w-3 h-3 rounded-full bg-emerald-600" />
                      <span>適格 80点〜</span>
                    </div>
                    <div className="flex items-center gap-1">
                      <div className="w-3 h-3 rounded-full bg-amber-600" />
                      <span>条件付 60〜79点</span>
                    </div>
                    <div className="flex items-center gap-1">
                      <div className="w-3 h-3 rounded-full bg-red-800" />
                      <span>要検討 〜59点</span>
                    </div>
                  </div>
                )}

                {result.instantFail && (
                  <div className="bg-red-50 border border-red-300 rounded p-3 mb-3 text-xs text-red-900 leading-relaxed font-medium">
                    ⚠ {result.instantFailReason}
                  </div>
                )}

                {/* ランク説明 */}
                <div className={`rounded p-3 text-xs leading-relaxed ${rankStyle.bg}`}
                  style={{ border: `1px solid ${rankStyle.ringColor}30` }}>
                  <div className="flex items-start gap-2">
                    {React.createElement(rankStyle.icon, { size: 14, style: { color: rankStyle.ringColor, flexShrink: 0, marginTop: 1 } })}
                    <p style={{ color: rankStyle.ringColor === '#047857' ? '#064e3b' : rankStyle.ringColor === '#b45309' ? '#78350f' : '#7f1d1d' }}>
                      {t.ranks[result.rank]}
                    </p>
                  </div>
                </div>
              </div>

              {/* スコア内訳 */}
              {!result.instantFail && (
                <div className="border-t border-stone-100 px-4 sm:px-5 py-4" style={{ background: '#fafaf9' }}>
                  <div className="flex items-center gap-2 mb-3">
                    <TrendingUp size={12} className="text-stone-500" />
                    <div className="text-[10px] font-bold text-stone-500 tracking-widest">スコア内訳</div>
                  </div>
                  <div className="space-y-3">
                    {result.breakdown.map((b, i) => (
                      <div key={i} className={b.isBonus ? "pl-3 border-l-2 border-amber-400" : ""}>
                        <div className="flex items-baseline justify-between mb-1">
                          <span className={`text-[11px] font-semibold truncate pr-2 ${b.isBonus ? "text-amber-700" : "text-stone-600"}`}>
                            {b.isBonus && <span className="mr-1 text-amber-500">＋</span>}
                            {b.axis}
                          </span>
                          <div className="flex items-center gap-1 flex-shrink-0">
                            <span className="text-[11px] font-bold text-stone-900">{b.score}</span>
                            <span className="text-[10px] text-stone-400">/ {b.max}</span>
                            {b.score === b.max && b.max > 0 && (
                              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#047857" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                            )}
                          </div>
                        </div>
                        <ScoreBar score={b.score} max={b.max} animated />
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>

            {/* ── 不足要件 ── */}
            {result.deficiencies.length > 0 && (
              <div className="section-card overflow-hidden fade-in" style={{ border: '1px solid #fecaca' }}>
                <div className="px-4 py-2.5 border-b flex items-center gap-2" style={{ background: '#fff1f1', borderColor: '#fecaca' }}>
                  <AlertCircle size={13} className="text-red-800" />
                  <h3 className="text-xs font-bold text-red-900 tracking-widest">不足要件</h3>
                  <span className="ml-auto text-[10px] font-bold text-red-700 bg-red-100 px-2 py-0.5 rounded-full">{result.deficiencies.length}項目</span>
                </div>
                <ul className="p-4 space-y-2">
                  {result.deficiencies.map((d, i) => (
                    <li key={i} className="flex items-start gap-2.5 text-xs text-stone-800 leading-relaxed">
                      <div className="flex-shrink-0 w-4 h-4 rounded-full bg-red-100 flex items-center justify-center mt-0.5">
                        <div className="w-1.5 h-1.5 rounded-full bg-red-700" />
                      </div>
                      <span>{d}</span>
                    </li>
                  ))}
                </ul>
              </div>
            )}

            {/* ── 補完アドバイス ── */}
            {result.recommendations.length > 0 && (
              <div className="section-card overflow-hidden fade-in">
                <div className="px-4 py-2.5 border-b border-stone-100 flex items-center gap-2" style={{ background: '#fafaf9' }}>
                  <FileText size={13} className="text-red-800" />
                  <h3 className="text-xs font-bold text-stone-600 tracking-widest">補完アドバイス</h3>
                </div>
                <ol className="p-4 space-y-2.5">
                  {result.recommendations.map((r, i) => (
                    <li key={i} className="flex items-start gap-2.5 text-xs text-stone-700 leading-relaxed">
                      <span className="flex-shrink-0 w-5 h-5 rounded bg-stone-100 text-stone-600 font-bold text-[10px] flex items-center justify-center mt-0.5">{i+1}</span>
                      <span>{r}</span>
                    </li>
                  ))}
                </ol>
              </div>
            )}

            {/* ── レポート出力 ── */}
            <div className="section-card overflow-hidden">
              <SectionHeader icon={<FileText />} title="診断レポート出力" />
              <div className="p-4 sm:p-5">
                <div className="grid grid-cols-2 gap-3 mb-4">
                  <div>
                    <FieldLabel>受入企業名</FieldLabel>
                    <TextInput value={clientName} onChange={e => setClientName(e.target.value)} placeholder="株式会社○○" />
                  </div>
                  <div>
                    <FieldLabel>対象者氏名</FieldLabel>
                    <TextInput value={candidateName} onChange={e => setCandidateName(e.target.value)} placeholder="グエン・○○" />
                  </div>
                </div>
                <button onClick={() => generateWordReport(input, result, clientName, candidateName)}
                  className="download-btn w-full px-4 py-3.5 text-white font-bold text-sm
                             rounded flex items-center justify-center gap-2 tracking-wide">
                  <Download size={16} />
                  Word形式でダウンロード（.doc）
                </button>
                <p className="text-[10px] text-stone-400 mt-2 leading-relaxed">
                  ※ Microsoft Word互換形式。事務所名・登録番号・診断日が自動挿入されます。
                </p>
              </div>
            </div>

            {/* ── CTA ── */}
            <div className="rounded overflow-hidden" style={{ background: 'linear-gradient(135deg, #1c1917 0%, #44403c 100%)', border: '1px solid #57534e' }}>
              <div className="px-5 py-4">
                <div className="text-[10px] text-stone-400 tracking-widest mb-1.5 font-bold">PROFESSIONAL CONSULTATION</div>
                <div className="font-mincho text-base font-bold text-white mb-1 leading-snug">
                  本格的なご相談は<br className="sm:hidden" />無料初回相談でどうぞ
                </div>
                <p className="text-[11px] text-stone-300 leading-relaxed mb-1">
                  この診断はあくまで目安です。在留状況・雇用条件・協議会加入手続きなど、実務上の課題は個別にお確かめください。申請取次行政書士が直接対応します。
                </p>
                <p className="text-[11px] text-stone-400 leading-relaxed mb-4">
                  電話受付：平日9:00〜18:00（土日祝休）
                </p>
                <div className="grid grid-cols-1 gap-2 sm:grid-cols-2">
                  <a href="tel:072-741-6693"
                    className="cta-btn flex items-center justify-center gap-2 px-4 py-3 rounded text-white text-xs font-bold tracking-wide"
                    style={{ minHeight: 48, background: 'linear-gradient(135deg, #991b1b 0%, #7f1d1d 100%)' }}>
                    <Phone size={14} />
                    電話相談 072-741-6693
                  </a>
                  <a href="mailto:yasuo@yoshioka-gyosei.jp?subject=%E7%89%B9%E5%AE%9A%E6%8A%80%E8%83%BD%E3%81%AB%E9%96%A2%E3%81%99%E3%82%8B%E3%81%8A%E5%95%8F%E3%81%84%E5%90%88%E3%82%8F%E3%81%9B&body=%E3%80%90%E3%81%8A%E5%90%8D%E5%89%8D%E3%80%91%0A%0A%E3%80%90%E3%81%94%E7%9B%B8%E8%AB%87%E5%86%85%E5%AE%B9%E3%80%91%0A%0A"
                    className="flex items-center justify-center gap-2 px-4 py-3 rounded text-stone-200 text-xs font-bold tracking-wide transition-colors hover:bg-white/10"
                    style={{ minHeight: 48, border: '1px solid rgba(255,255,255,0.2)' }}>
                    <Mail size={14} />
                    メールで問い合わせ
                  </a>
                </div>
              </div>
            </div>

            {/* ── 注記 ── */}
            <div className="rounded p-4 text-xs text-stone-700 leading-relaxed" style={{ background: '#fffbeb', border: '1px solid #fde68a' }}>
              <div className="flex items-start gap-2">
                <AlertCircle size={13} className="text-amber-700 mt-0.5 flex-shrink-0" />
                <div>
                  <div className="font-bold mb-1 text-amber-800">本診断ツールについて</div>
                  <p className="mb-1.5">本診断は、入力情報をもとに出入国在留管理庁公表の最新基準（2024年3月閣議決定の4分野追加を反映）に照らして特定技能1号の適合性を機械的に評価するものです。最終判断は出入国在留管理局の審査によります。</p>
                  <p>個人情報・企業情報は行政書士法第12条（守秘義務）に基づき厳重に管理されます。</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        {/* ────────────────────────────────────────
            フッター
        ──────────────────────────────────────── */}
        <footer className="mt-12 sm:mt-16 pt-8 border-t-2 border-stone-300">
          <div className="flex flex-col sm:flex-row items-center sm:items-start justify-between gap-6">
            <div className="text-center sm:text-left">
              <div className="font-mincho text-lg font-bold text-stone-800 mb-1.5 flex items-center gap-2 justify-center sm:justify-start">
                <Stamp size={18} className="text-red-800" />
                行政書士 吉岡康生事務所
              </div>
              <div className="text-xs text-stone-500 leading-relaxed">
                登録番号 第25306704号 ／ 兵庫県行政書士会阪神支部 ／ 申請取次行政書士
              </div>
              <div className="text-xs text-stone-500 leading-relaxed mt-1">
                TEL：072-741-6693 ／ Email：yasuo@yoshioka-gyosei.jp ／ 平日9:00〜18:00（土日祝休）
              </div>
            </div>
            <div className="text-center sm:text-right">
              <div className="text-[10px] text-stone-400 leading-relaxed">
                判定エンジン v{REQUIREMENTS.version} ／ 最終更新 {REQUIREMENTS.last_updated}
              </div>
              <div className="text-[10px] text-stone-400 mt-0.5">
                © 行政書士 吉岡康生事務所 All rights reserved.
              </div>
            </div>
          </div>
          <div className="mt-6 pt-5 border-t border-stone-200 flex flex-col sm:flex-row items-center justify-between gap-3">
            <p className="text-[10px] text-stone-400 leading-relaxed text-center sm:text-left max-w-lg">
              本ツールは行政書士事務所が提供する情報提供サービスです。個別の在留資格申請に係るご依頼はお問い合わせください。
              行政書士法第12条（守秘義務）に基づき、ご相談内容は厳重に管理いたします。

            <a href="gijinkoku_simulator.html"

            </a>
          </div>
        </footer>
      </main>
    </div>
  );
