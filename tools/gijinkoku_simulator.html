/* ========================================================================
   判定エンジン
   ======================================================================== */
function classifyJobCategory(applicant) {
  const text = (applicant.jobTitle + " " + applicant.jobDescription + " " + applicant.majorField).toLowerCase();
  const intl = ["翻訳", "通訳", "語学", "海外取引", "貿易", "広報", "宣伝", "デザイン"];
  const tech = ["エンジニア", "システム", "プログラム", "設計", "機械", "電気", "土木", "建築", "研究", "開発", "化学", "物理"];
  if (intl.some(k => text.includes(k))) return "international";
  if (tech.some(k => text.includes(k))) return "technical";
  return "humanities";
}

function majorRelevanceScore(major, jobDesc) {
  if (!major || !jobDesc) return 0;
  const pairs = [
    [["情報", "コンピュータ", "ソフトウェア"], ["システム", "プログラム", "エンジニア", "ソフトウェア", "開発"]],
    [["経済", "経営", "商", "ビジネス"], ["経理", "財務", "マーケティング", "経営", "企画", "営業"]],
    [["法学", "法律"], ["法務", "コンプライアンス", "契約"]],
    [["機械", "電気", "電子"], ["設計", "開発", "技術", "製造"]],
    [["建築", "土木"], ["設計", "施工", "建築"]],
    [["文学", "言語", "語学"], ["翻訳", "通訳", "語学指導"]],
    [["国際関係", "国際"], ["海外", "国際", "貿易", "海外取引"]],
  ];
  const m = major.toLowerCase(); const j = jobDesc.toLowerCase();
  for (const [mks, jks] of pairs) {
    if (mks.some(k => m.includes(k.toLowerCase())) && jks.some(k => j.includes(k.toLowerCase()))) return 2;
  }
  const common = ["管理", "企画", "分析", "研究", "国際", "開発"];
  for (const t of common) { if (m.includes(t) && j.includes(t)) return 1; }
  return 0;
}

function professionalismScore(jobDesc, pos, neg) {
  if (!jobDesc) return 0;
  const t = jobDesc.toLowerCase();
  const hasP = pos.some(k => t.includes(k.toLowerCase()));
  const hasN = neg.some(k => t.includes(k.toLowerCase()));
  if (hasN && !hasP) return -1;
  if (hasP) return 1;
  return 0;
}

function judgeGijinkoku(applicant) {
  const g = REQUIREMENTS.gijinkoku;
  const checks = []; const missing = []; const suggestions = [];
  const category = classifyJobCategory(applicant);
  const cat = g.categories[category];

  const eduOk = ["doctor", "master", "bachelor", "professional_degree"].includes(applicant.educationLevel);
  const senmonOk = applicant.educationLevel === "senmon" && applicant.isJapaneseUniversity;
  const expReq = cat.experience_alternative_years;
  const expOk = applicant.careerYears >= expReq;
  const eduOrExp = eduOk || senmonOk || expOk;

  let eduDetail;
  if (eduOk) eduDetail = "大学卒業（学士）以上を充足";
  else if (senmonOk) eduDetail = "日本の専門学校卒業（専門士・高度専門士）として充足";
  else if (expOk) eduDetail = `実務経験${applicant.careerYears}年で要件（${expReq}年）を充足`;
  else {
    eduDetail = `学歴要件不該当、実務経験${applicant.careerYears}年も必要年数${expReq}年に不足`;
    missing.push("学歴または実務経験要件");
    if (applicant.careerYears > 0 && expReq > applicant.careerYears) {
      suggestions.push(`あと${expReq - applicant.careerYears}年の関連実務経験積み上げで充足可能`);
    }
    if (applicant.educationLevel === "senmon" && !applicant.isJapaneseUniversity) {
      suggestions.push("海外専門学校卒の場合、日本の専門学校卒業（専門士相当）の証明書取得を検討");
    }
  }
  checks.push({ name: "学歴または実務経験", satisfied: eduOrExp, detail: eduDetail, legal_basis: "上陸基準省令 技術・人文知識・国際業務の項" });

  let relevanceOk = true; let relevanceDetail = ""; let relevanceBorderline = false;
  if (cat.must_match_major) {
    if (eduOk || senmonOk) {
      const score = majorRelevanceScore(applicant.majorField, applicant.jobDescription);
      if (score >= 2) relevanceDetail = "専攻と業務の関連性が明確";
      else if (score === 1) { relevanceDetail = "専攻と業務の関連性が弱い（境界事例）。立証資料での補強推奨"; relevanceBorderline = true; }
      else { relevanceOk = false; relevanceDetail = "専攻と業務に関連性が認められない"; missing.push("専攻と業務の関連性"); suggestions.push("業務内容の見直し、または専攻との接続を示す追加資料の準備"); }
    } else relevanceDetail = "実務経験経由のため専攻関連性は要件外";
  } else relevanceDetail = "国際業務系は専攻不問";
  checks.push({ name: "専攻と業務の関連性", satisfied: relevanceOk, detail: relevanceDetail, legal_basis: "上陸基準省令 技術・人文知識・国際業務の項" });

  const salaryOk = applicant.monthlySalaryJpy >= g.salary_threshold_jpy_monthly;
  let salaryDetail;
  if (salaryOk) salaryDetail = `月額${applicant.monthlySalaryJpy.toLocaleString()}円で目安額（${g.salary_threshold_jpy_monthly.toLocaleString()}円）以上`;
  else {
    salaryDetail = `月額${applicant.monthlySalaryJpy.toLocaleString()}円は目安額（${g.salary_threshold_jpy_monthly.toLocaleString()}円）を下回る`;
    missing.push("報酬要件（日本人同等額）");
    suggestions.push("給与の見直し、もしくは同職種・同地域の日本人給与水準との比較資料の準備");
  }
  checks.push({ name: "報酬要件（日本人同等額以上）", satisfied: salaryOk, detail: salaryDetail, legal_basis: "上陸基準省令 技術・人文知識・国際業務の項" });

  const profScore = professionalismScore(applicant.jobDescription, g.professional_keywords_positive, g.professional_keywords_negative);
  let profOk = true; let profDetail;
  if (profScore >= 1) profDetail = "業務内容に専門性キーワードが含まれており、単純労働該当性は低い";
  else if (profScore === 0) { profDetail = "業務内容の記述が抽象的。具体的業務内容の補強推奨"; relevanceBorderline = true; }
  else { profOk = false; profDetail = "業務内容に単純労働を示すキーワードが含まれる。在留資格該当性に問題あり"; missing.push("業務の専門性"); suggestions.push("業務内容を専門性が明確に伝わる形で記述し直す。職務記述書の作成を推奨"); }
  checks.push({ name: "業務の専門性（在留資格該当性）", satisfied: profOk, detail: profDetail, legal_basis: "入管法 別表第一の二の表 技術・人文知識・国際業務の項" });

  const allOk = checks.every(c => c.satisfied);
  const oneMissing = checks.filter(c => !c.satisfied).length === 1;
  let rank, decision;
  if (allOk && !relevanceBorderline) { rank = "A"; decision = "申請可能"; }
  else if (allOk && relevanceBorderline) { rank = "B"; decision = "申請可能"; }
  else if (oneMissing && (missing.includes("専攻と業務の関連性") || relevanceBorderline)) { rank = "C"; decision = "条件付き可能"; }
  else if (oneMissing) { rank = "D"; decision = "困難"; }
  else { rank = "E"; decision = "不可"; }

  return {
    visaType: `${g.name}（${cat.label}）`, rank, rankLabel: g.ranks[rank], decision,
    checks, missing, suggestions, legalBases: g.legal_basis,
  };
}

function ageKey(age) {
  if (age <= 29) return "u30"; if (age <= 34) return "u35"; if (age <= 39) return "u40"; return "o40";
}

function judgeKodo(applicant, typeCode) {
  const k = REQUIREMENTS.kodo_senmonshoku_1;
  const breakdown = []; let total = 0;

  const eduMap = { doctor: k.education_points.doctor, master: k.education_points.master, professional_degree: k.education_points.master, bachelor: k.education_points.bachelor };
  if (eduMap[applicant.educationLevel]) {
    const e = eduMap[applicant.educationLevel];
    breakdown.push({ category: "学歴", label: e.label, points: e.points });
    total += e.points;
  }
  if (applicant.hasMultipleDegrees) { breakdown.push({ category: "学歴", label: k.education_points.bonus_multiple.label, points: 5 }); total += 5; }
  if (applicant.hasMbaMot && (typeCode === "ro" || typeCode === "ha")) { breakdown.push({ category: "学歴", label: k.education_points.bonus_mba_mot.label, points: 5 }); total += 5; }

  const relevantYears = typeCode === "ha" ? Math.max(applicant.managementCareerYears || 0, applicant.careerYears) : applicant.careerYears;
  for (const tier of k.career_points[typeCode]) {
    if (relevantYears >= tier.years) {
      breakdown.push({ category: "職歴", label: `職務経験${relevantYears}年（${tier.years}年以上区分）`, points: tier.pts });
      total += tier.pts; break;
    }
  }

  const income = applicant.annualIncomeJpy > 0 ? applicant.annualIncomeJpy : applicant.monthlySalaryJpy * 12;
  const incomeMan = income / 10000;
  if (typeCode === "i" || typeCode === "ro") {
    const ageK = ageKey(applicant.age);
    for (const tier of k.income_table_iro) {
      if (incomeMan >= tier.man) {
        const pts = tier.by_age[ageK];
        if (pts > 0) {
          breakdown.push({ category: "年収", label: `年収${Math.floor(incomeMan)}万円（${tier.man}万円帯／${ageK}）`, points: pts });
          total += pts;
        }
        break;
      }
    }
  } else {
    for (const tier of k.income_table_ha) {
      if (incomeMan >= tier.man) {
        breakdown.push({ category: "年収", label: `年収${Math.floor(incomeMan)}万円（${tier.man}万円帯）`, points: tier.pts });
        total += tier.pts; break;
      }
    }
  }

  if (typeCode === "i" || typeCode === "ro") {
    for (const tier of k.age_iro) {
      if (applicant.age <= tier.max) {
        breakdown.push({ category: "年齢", label: `${tier.max}歳以下`, points: tier.pts });
        total += tier.pts; break;
      }
    }
  }

  if (applicant.hasResearchPatent) { breakdown.push({ category: "ボーナス", label: "発明者として登録された特許1件以上", points: 20 }); total += 20; }
  if (applicant.inInnovationProject) { breakdown.push({ category: "ボーナス", label: "イノベーション促進支援措置事業に従事", points: 10 }); total += 10; }
  if (applicant.isJapaneseUniversity) { breakdown.push({ category: "ボーナス", label: "本邦の大学卒業／大学院修了", points: 10 }); total += 10; }
  if (applicant.jlptLevel === "N1") { breakdown.push({ category: "ボーナス", label: "日本語能力試験N1取得", points: 15 }); total += 15; }
  else if (applicant.jlptLevel === "N2") { breakdown.push({ category: "ボーナス", label: "日本語能力試験N2取得", points: 10 }); total += 10; }
  if (applicant.inGrowthField) { breakdown.push({ category: "ボーナス", label: "成長分野での就労", points: 10 }); total += 10; }
  if (applicant.completedAdvancedTraining) { breakdown.push({ category: "ボーナス", label: "法務大臣告示の研修修了", points: 5 }); total += 5; }

  const minIncome = k.min_annual_income_jpy[typeCode];
  const incomeMinOk = income >= minIncome;
  const missing = []; const suggestions = [];

  let rank, decision;
  if (!incomeMinOk) {
    missing.push(`最低年収要件（${minIncome.toLocaleString()}円以上）`);
    suggestions.push(`年収を${minIncome.toLocaleString()}円以上に引き上げる必要あり（現在${income.toLocaleString()}円）`);
    rank = "E"; decision = "不可";
  } else if (total >= 80) { rank = "A"; decision = "申請可能"; }
  else if (total >= 70) { rank = "B"; decision = "申請可能"; }
  else if (total >= 60) {
    rank = "C"; decision = "条件付き可能";
    const gap = 70 - total;
    missing.push(`認定基準70点に${gap}点不足`);
    if (!["N1", "N2"].includes(applicant.jlptLevel)) suggestions.push("日本語能力試験N1取得（+15点）またはN2取得（+10点）");
    else if (applicant.jlptLevel === "N2") suggestions.push("日本語能力試験N1取得（+5点：N2との差分）");
    if (!applicant.hasResearchPatent && (typeCode === "i" || typeCode === "ro")) suggestions.push("業務関連の特許登録または論文発表（+20点）");
    if (!applicant.inGrowthField) suggestions.push("成長分野（AI・バイオ等）での就労（+10点）");
    suggestions.push("年収100万円アップで5〜10点上昇の可能性");
  } else if (total >= 50) {
    rank = "D"; decision = "困難";
    missing.push(`認定基準70点に${70 - total}点不足`);
    suggestions.push("技術・人文知識・国際業務の併願検討を推奨");
  } else {
    rank = "E"; decision = "不可";
    missing.push("ポイント大幅不足。技術・人文知識・国際業務の判定を優先");
  }

  return {
    visaType: `${k.name} ${k.types[typeCode].label}`,
    rank, rankLabel: k.ranks[rank], decision, score: total,
    breakdown, missing, suggestions, legalBases: k.legal_basis,
  };
}

function judgeJSkip(applicant) {
  const j = REQUIREMENTS.j_skip;
  const income = applicant.annualIncomeJpy > 0 ? applicant.annualIncomeJpy : applicant.monthlySalaryJpy * 12;
  const matched = [];

  if (["master", "doctor", "professional_degree"].includes(applicant.educationLevel) && income >= 20000000) {
    matched.push("修士号以上 ＋ 年収2,000万円以上（イ・ロ）");
  }
  if (applicant.careerYears >= 10 && income >= 20000000) {
    matched.push("実務経験10年以上 ＋ 年収2,000万円以上（イ・ロ）");
  }
  if ((applicant.managementCareerYears || 0) >= 5 && income >= 40000000) {
    matched.push("経営・管理実務経験5年以上 ＋ 年収4,000万円以上（ハ）");
  }

  if (matched.length > 0) {
    return {
      visaType: j.name, rank: "A", rankLabel: "特別高度人材として認定可能（最優遇）", decision: "申請可能",
      checks: [{ name: "J-Skip該当パターン", satisfied: true, detail: matched.join(" / "),
                 legal_basis: "高度専門職省令 特別高度人材関連規定（2023年4月施行）" }],
      missing: [], suggestions: j.benefits.map(b => `特典：${b}`),
      legalBases: j.legal_basis,
    };
  }

  const incomeMan = income / 10000;
  const nearMiss = [];
  if (incomeMan >= 1500 && ["master", "doctor", "professional_degree"].includes(applicant.educationLevel)) {
    nearMiss.push(`年収を${(20000000 - income).toLocaleString()}円増やせばイ・ロ要件充足`);
  }
  if (incomeMan >= 3000 && (applicant.managementCareerYears || 0) >= 5) {
    nearMiss.push(`年収を${(40000000 - income).toLocaleString()}円増やせばハ要件充足`);
  }

  if (nearMiss.length > 0) {
    return {
      visaType: j.name, rank: "C", rankLabel: "条件付き可能：年収要件にあと一歩", decision: "条件付き可能",
      missing: ["年収要件未充足"], suggestions: nearMiss, legalBases: j.legal_basis,
    };
  }
  return null;
}

function judgeAll(applicant) {
  const judgments = {};
  judgments.gijinkoku = judgeGijinkoku(applicant);
  judgments.kodo_i = judgeKodo(applicant, "i");
  judgments.kodo_ro = judgeKodo(applicant, "ro");
  judgments.kodo_ha = judgeKodo(applicant, "ha");
  const j = judgeJSkip(applicant);
  if (j) judgments.j_skip = j;

  const priority = { A: 0, B: 1, C: 2, D: 3, E: 4 };
  let best = null;
  for (const v of Object.values(judgments)) {
    if (!best || priority[v.rank] < priority[best.rank]) best = v;
  }
  return { judgments, best };
}

              <div className="text-xs font-bold text-stone-700 mb-2 tracking-wider">● ポイント内訳</div>
              <div className="border border-stone-200 rounded-sm overflow-hidden">
                <table className="w-full text-xs">
                  <thead className="bg-stone-900 text-white">
                    <tr>
                      <th className="px-3 py-1.5 text-left font-medium">カテゴリ</th>
                      <th className="px-3 py-1.5 text-left font-medium">項目</th>
                      <th className="px-3 py-1.5 text-right font-medium">点</th>
                    </tr>
                  </thead>
                  <tbody>
                    {judgment.breakdown.map((b, i) => (
                      <tr key={i} className="border-t border-stone-100">
                        <td className="px-3 py-1.5 text-stone-600">{b.category}</td>
                        <td className="px-3 py-1.5 text-stone-800">{b.label}</td>
                        <td className="px-3 py-1.5 text-right text-red-700 font-bold">+{b.points}</td>
                      </tr>
                    ))}
                    <tr className="border-t border-stone-300 bg-stone-50">
                      <td colSpan={2} className="px-3 py-1.5 text-right font-bold text-stone-700">合計</td>
                      <td className="px-3 py-1.5 text-right font-bold text-red-700 text-sm">{judgment.score}点</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {judgment.checks && judgment.checks.length > 0 && (
            <div>
              <div className="text-xs font-bold text-stone-700 mb-2 tracking-wider">● 要件充足チェック</div>
              <div className="space-y-2">
                {judgment.checks.map((c, i) => (
                  <div key={i} className="text-xs">
                    <div className="flex items-start gap-2">
                      {c.satisfied ? <CheckCircle2 size={14} className="text-emerald-700 mt-0.5 flex-shrink-0" />
                                   : <XCircle size={14} className="text-red-700 mt-0.5 flex-shrink-0" />}
                      <div className="flex-1">
                        <div className="font-bold text-stone-800">{c.name}</div>
                        <div className="text-stone-600 mt-0.5">{c.detail}</div>
                        {c.legal_basis && <div className="text-stone-400 italic mt-0.5 text-[10px]">［根拠］{c.legal_basis}</div>}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {judgment.missing && judgment.missing.length > 0 && (
            <div>
              <div className="text-xs font-bold text-red-800 mb-2 tracking-wider">● 不足要件</div>
              <ul className="space-y-1 text-xs text-stone-700">
                {judgment.missing.map((m, i) => <li key={i} className="pl-3">・ {m}</li>)}
              </ul>
            </div>
          )}

          {judgment.suggestions && judgment.suggestions.length > 0 && (
            <div className="bg-red-50 border-l-2 border-red-700 px-3 py-2.5">
              <div className="text-xs font-bold text-red-800 mb-1.5 tracking-wider">● 推奨対応・解決策</div>
              <ul className="space-y-1 text-xs text-stone-700">
                {judgment.suggestions.map((s, i) => <li key={i} className="pl-2">・ {s}</li>)}
              </ul>
            </div>
          )}

          {judgment.legalBases && judgment.legalBases.length > 0 && (
            <details className="text-xs">
              <summary className="cursor-pointer text-stone-500 hover:text-stone-700 select-none">法的根拠を表示</summary>
              <div className="mt-2 space-y-1.5 pl-3 border-l border-stone-200">
                {judgment.legalBases.map((lb, i) => (
                  <div key={i}>
                    <div className="font-bold text-stone-700">{lb.law} {lb.article}</div>
                    <div className="text-stone-500">{lb.summary}</div>
                  </div>
                ))}
              </div>
            </details>
          )}
        </div>
      )}
    </div>
  );
}
